<!doctype html>

<head>

<title>The GYM Management System | Opening workspace</title>

<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#182521;background:#f4f7f6;font-synthesis:none}
*{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100svh;display:flex;flex-direction:column}
header,footer{display:flex;align-items:center;justify-content:space-between;padding:24px 7%;gap:16px;font-size:12px;color:#64736d}
header{border-bottom:1px solid #dce4df}header strong{color:#233e32;font-size:14px}.badge{display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:#168357;border-radius:50%}
main{flex:1;display:grid;place-content:center;text-align:center;padding:48px 24px;overflow:hidden}
.visual{position:relative;width:260px;height:160px;margin:0 auto 36px}.monitor{position:absolute;width:176px;height:113px;left:42px;top:8px;border:3px solid #254738;border-radius:8px;background:#fff;box-shadow:0 12px 30px #24493612;padding:12px}
.screen{height:78px;background:#e9f2ed;border-radius:3px;display:grid;grid-template-columns:24px 1fr;gap:8px;padding:10px;overflow:hidden}.rail{background:#b8d6c5;border-radius:2px}.rows{display:flex;flex-direction:column;gap:7px;padding-top:3px}.rows i{height:7px;background:#84b99b;border-radius:2px;animation:scan 1.8s ease-in-out infinite}.rows i:nth-child(2){width:70%;animation-delay:.2s}.rows i:nth-child(3){width:85%;animation-delay:.4s}
.stand{position:absolute;top:121px;left:117px;width:26px;height:17px;background:#254738}.stand:after{content:'';position:absolute;top:16px;left:-24px;width:74px;height:5px;background:#254738;border-radius:3px}
.tag{position:absolute;right:12px;bottom:12px;background:#e2eeff;border:1px solid #bad1f1;padding:10px;border-radius:6px;transform:rotate(8deg)}.barcode{width:42px;height:28px;background:repeating-linear-gradient(90deg,#376093 0 2px,transparent 2px 5px,#376093 5px 6px,transparent 6px 9px)}
.check{position:absolute;left:15px;bottom:30px;width:34px;height:34px;background:#177c51;color:white;border:4px solid #f4f7f6;border-radius:50%;font-size:19px;line-height:26px}
.eyebrow{color:#22784f;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px}h1{font-size:32px;line-height:1.2;margin:12px 0;overflow-wrap:anywhere;max-width:600px}p{font-size:15px;line-height:1.6;color:#64736d;margin:0 auto;max-width:360px}
.progress{height:3px;background:#dae6df;width:180px;overflow:hidden;margin:28px auto 14px;border-radius:2px}.progress:after{content:'';display:block;width:45%;height:100%;background:#20845b;animation:travel 1.6s ease-in-out infinite}.status{font-size:12px}
a{display:inline-flex;align-items:center;justify-content:center;gap:18px;margin:28px auto 0;min-height:46px;padding:12px 22px;background:#213f31;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600}a:hover{background:#306246}a:focus-visible{outline:3px solid #467fc0;outline-offset:4px}footer{border-top:1px solid #dce4df}
@keyframes travel{from{transform:translateX(-110%)}to{transform:translateX(330%)}}@keyframes scan{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important}.progress:after{width:100%}}
@media(max-width:480px){header,footer{padding:18px 22px}header .badge{display:none}main{padding:36px 22px}h1{font-size:27px}footer{font-size:11px;flex-wrap:wrap}}
</style>
</head>
<body>
<header><strong>IT / WORKSPACE</strong><span class="badge"><span class="dot"></span>Asset management portal</span></header>
<main><div>
<div class="visual" aria-hidden="true"><div class="monitor"><div class="screen"><div class="rail"></div><div class="rows"><i></i><i></i><i></i></div></div></div><div class="stand"></div><div class="tag"><div class="barcode"></div></div><div class="check">&#10003;</div></div>
<div class="eyebrow">Everything in its place</div>
<h1>The GYM Management System</h1>
<p>Your assets. Your team. One workspace.</p>
<div class="progress" aria-hidden="true"></div>
<p class="status" role="status">Opening your workspace...</p>
<a id="destination" href="https://floyd-seniors-reservation-closing.trycloudflare.com/">Open workspace <span aria-hidden="true">&#8594;</span></a>
</div></main>
<footer><span>IT Asset Manager</span><span>Inventory &middot; Handovers &middot; Audit</span></footer>
<script>setTimeout(function(){window.location.replace(document.getElementById('destination').href)},1400);</script>
</body></html>
